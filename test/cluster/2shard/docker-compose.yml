# Local 2-shard x 2-replica ClickHouse cluster for chkit MULTI-SHARD verification.
#
#   2 shards, 2 replicas each (ch1/ch2 = shard 01, ch3/ch4 = shard 02) + 1 Keeper.
#   Cluster name: test_cluster_2s
#
# Replicas are named PER SHARD (01/02 reused across shards) on purpose — that is
# the layout that exposes a no-{shard} journal path whose replica id isn't unique
# cluster-wide. Coexists with the 1-shard cluster (distinct ports/network/names).
#
#   docker compose -f test/cluster/2shard/docker-compose.yml up -d --wait
#   docker compose -f test/cluster/2shard/docker-compose.yml down -v
#
# Endpoints: ch1 :8133  ch2 :8134  ch3 :8135  ch4 :8136  (user default / clusterpass)
name: chkit-cluster-2s

x-ch-common: &ch-common
  image: clickhouse/clickhouse-server:25.3
  environment:
    CLICKHOUSE_PASSWORD: clusterpass
  ulimits:
    nofile: { soft: 262144, hard: 262144 }
  networks: [chkit2s]
  depends_on:
    keeper:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  keeper:
    image: clickhouse/clickhouse-keeper:25.3
    container_name: chkit-2s-keeper
    hostname: keeper
    volumes:
      - ./keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    networks: [chkit2s]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9181"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  ch1:
    <<: *ch-common
    container_name: chkit-2s-ch1
    hostname: ch1
    volumes:
      - ./config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./ch1/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
    ports: ["8133:8123", "9100:9000"]

  ch2:
    <<: *ch-common
    container_name: chkit-2s-ch2
    hostname: ch2
    volumes:
      - ./config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./ch2/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
    ports: ["8134:8123", "9101:9000"]

  ch3:
    <<: *ch-common
    container_name: chkit-2s-ch3
    hostname: ch3
    volumes:
      - ./config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./ch3/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
    ports: ["8135:8123", "9102:9000"]

  ch4:
    <<: *ch-common
    container_name: chkit-2s-ch4
    hostname: ch4
    volumes:
      - ./config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./ch4/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
    ports: ["8136:8123", "9103:9000"]

networks:
  chkit2s:
    driver: bridge

name: "Setup Bun"
description: "Setup Bun and uv (for chkit_python) and install cached dependencies"
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - uses: actions/cache@v3
      name: Setup bun cache
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-store-v4-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-store-v4

    # chkit_python's Turbo tasks run ruff, mypy, pytest and the wheel build
    # through uv (Python version: chkit_python/.python-version).
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: 0.13.0
        enable-cache: true
        cache-dependency-glob: chkit_python/uv.lock
        ignore-nothing-to-cache: true

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # "Release: prepare" opens its PR with GITHUB_TOKEN, which does not start
  # pull_request runs, so it dispatches CI on the release branch instead.
  workflow_dispatch:

jobs:
  verify:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Fallow analysis
        if: github.event_name == 'pull_request'
        uses: fallow-rs/fallow@v2
        with:
          format: sarif
          fail-on-issues: false

      - name: Upload Fallow SARIF
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fallow-results.sarif

      # Same command as locally: Turbo starts the test stack (test/infra) and
      # runs typecheck, lint, test and build.
      - name: Verify
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: bun run verify

  obsessiondb:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Fixture tables are shared on the managed test database. Let an active
    # run finish before another run reseeds them.
    concurrency:
      group: obsessiondb-tests
      cancel-in-progress: false
    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ObsessionDB test configuration
        run: |
          : "${CLICKHOUSE_HOST:?Set the CLICKHOUSE_HOST repository secret}"
          : "${CLICKHOUSE_PASSWORD:?Set the CLICKHOUSE_PASSWORD repository secret}"

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Test against ObsessionDB
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: bun run test:obsessiondb

  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [verify, obsessiondb]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

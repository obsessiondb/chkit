name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # "Release: prepare" opens its PR with GITHUB_TOKEN, which does not start
  # pull_request runs, so it dispatches CI on the release branch instead.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  verify:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Read release version
        id: version
        run: echo "version=$(bun -p 'require("./packages/cli/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Fallow analysis
        if: github.event_name == 'pull_request'
        uses: fallow-rs/fallow@v3
        with:
          # 3.43.0 fails its binary check (@fallow-cli/linux-x64-musl missing).
          version: 3.42.0
          format: sarif
          fail-on-issues: false

      - name: Upload Fallow SARIF
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fallow-results.sarif

      # Same command as locally: Turbo runs typecheck, lint, test and build,
      # restoring unchanged tasks from the remote cache. A test task that runs
      # starts the test stack (test/infra) first.
      - name: Verify
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: bun run verify

  obsessiondb:
    needs: verify
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       (needs.verify.result == 'success' &&
        ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
         (github.event_name == 'workflow_dispatch' &&
          !(startsWith(github.ref, 'refs/heads/release/') && contains(needs.verify.outputs.version, '-'))))))
    uses: ./.github/workflows/obsessiondb.yml
    secrets: inherit

  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: verify
    # Production and PR previews both deploy once verify passes. The
    # obsessiondb job reports on the managed target and gates nothing.
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: docs-deploy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs changes
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = 'push' ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              apps/docs/ registry/ scripts/build-registry.ts \
              scripts/registry-catalog.ts scripts/check-registry-docs.ts \
              packages/cli/src/registry/ package.json bun.lock turbo.json \
              .github/workflows/ci.yml .github/actions/setup/)"
            if [ -n "$changed_files" ]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Bun
        if: steps.docs.outputs.changed == 'true'
        uses: ./.github/actions/setup

      - name: Deploy production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

      - name: Build docs preview
        if: github.event_name == 'pull_request' && steps.docs.outputs.changed == 'true'
        env:
          PUBLIC_AGENTATION_ENABLED: 'true'
        run: bun run docs:build

      - name: Deploy docs preview
        id: preview
        if: github.event_name == 'pull_request' && steps.docs.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          packageManager: bun
          command: pages deploy dist --project-name=chkit-docs --branch=pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Show docs preview URL
        if: github.event_name == 'pull_request' && steps.docs.outputs.changed == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          echo "[Open docs preview](${PREVIEW_URL:-$DEPLOYMENT_URL})" >> "$GITHUB_STEP_SUMMARY"

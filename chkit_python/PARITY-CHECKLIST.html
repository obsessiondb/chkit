<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chkit-py · TS Parity Checklist</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2530;
  --border: #30363d;
  --border-soft: #21262d;
  --fg: #e6edf3;
  --fg-dim: #8b949e;
  --fg-muted: #6e7681;
  --accent: #2f81f7;
  --accent-soft: #1f6feb33;
  --green: #3fb950;
  --green-bg: #238636;
  --orange: #d29922;
  --red: #f85149;
  --purple: #a371f7;
  --pink: #db61a2;
  --teal: #39c5cf;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #f0f3f7;
    --border: #d0d7de;
    --border-soft: #d8dee4;
    --fg: #1f2328;
    --fg-dim: #59636e;
    --fg-muted: #6e7681;
    --accent: #0969da;
    --accent-soft: #0969da22;
    --green: #1a7f37;
    --green-bg: #2da44e;
    --orange: #9a6700;
    --red: #cf222e;
    --purple: #8250df;
    --pink: #bf3989;
    --teal: #1b7c83;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body {
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
code, kbd { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
header h1 small { color: var(--fg-muted); font-weight: 400; margin-left: 6px; }
header .spacer { flex: 1; }
header .btn { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; }
header .btn:hover { background: var(--border-soft); }
header .btn.danger { color: var(--red); }
header .btn.primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

main { max-width: 1100px; margin: 0 auto; padding: 24px; }

.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px;
}
.stat-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.4px; }
.stat-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
.stat-value small { font-size: 13px; color: var(--fg-dim); font-weight: 400; }
.stat-bar { height: 6px; background: var(--border-soft); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.stat-bar > div { height: 100%; background: var(--green-bg); transition: width 0.3s; }

.bucket-bars {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 20px;
}
.bucket-bars h3 { margin: 0 0 12px 0; font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.bucket-row { display: grid; grid-template-columns: 110px 1fr 100px; align-items: center; gap: 12px; margin-bottom: 6px; }
.bucket-row .name { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.bucket-row .bar { height: 10px; background: var(--border-soft); border-radius: 5px; overflow: hidden; }
.bucket-row .bar > div { height: 100%; transition: width 0.3s; }
.bucket-row .num { font-size: 12px; color: var(--fg-dim); text-align: right; font-variant-numeric: tabular-nums; }

.filters {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 20px;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.filters input[type=text], .filters select {
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
.filters input[type=text] { flex: 1; min-width: 200px; }
.filters select { min-width: 140px; }
.filters .chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--fg-dim);
}
.filters .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.section { margin-bottom: 26px; }
.section-head {
  display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
  padding: 8px 0; border-bottom: 1px solid var(--border-soft); margin-bottom: 10px;
}
.section-head .title { font-weight: 600; font-size: 14.5px; flex: 1; }
.section-head .meta { font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.section-head .toggle { color: var(--fg-muted); font-size: 11px; }
.section.collapsed .items { display: none; }

.items { display: flex; flex-direction: column; gap: 4px; }

.item {
  display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start;
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 6px;
  padding: 10px 12px;
  transition: border-color 0.15s, background 0.15s;
}
.item:hover { border-color: var(--border); }
.item.done { opacity: 0.55; background: var(--panel-2); }
.item.done .title { text-decoration: line-through; }
.item.hidden { display: none; }

.item input[type=checkbox] {
  width: 16px; height: 16px; margin-top: 3px; accent-color: var(--green-bg); cursor: pointer;
}

.item .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item .title { font-weight: 500; font-size: 13.5px; }
.item .badge {
  display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 10px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; line-height: 1.5;
}
.b-critical    { background: #f8514922; color: var(--red);    border: 1px solid #f8514955; }
.b-useful      { background: #d2992222; color: var(--orange); border: 1px solid #d2992255; }
.b-niche       { background: #8b949e22; color: var(--fg-dim); border: 1px solid #8b949e55; }
.b-obsessiondb { background: #a371f722; color: var(--purple); border: 1px solid #a371f755; }
.b-backfill    { background: #db61a222; color: var(--pink);   border: 1px solid #db61a255; }
.b-scaffolder  { background: #39c5cf22; color: var(--teal);   border: 1px solid #39c5cf55; }
.b-loc { background: var(--border-soft); color: var(--fg-dim); border: 1px solid var(--border); }

.item .ts-path { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 11.5px; color: var(--fg-dim); margin-top: 4px; word-break: break-all; }
.item .notes { font-size: 12.5px; color: var(--fg-dim); margin-top: 4px; line-height: 1.45; }

footer { text-align: center; padding: 30px 0 60px 0; color: var(--fg-muted); font-size: 11.5px; }
footer a { color: var(--fg-dim); }

.empty {
  text-align: center; padding: 40px 0; color: var(--fg-muted); font-size: 13px;
  background: var(--panel); border: 1px dashed var(--border); border-radius: 8px;
}
</style>
</head>
<body>

<header>
  <h1>chkit-py · TS Parity Checklist <small id="version">v1</small></h1>
  <div class="spacer"></div>
  <button class="btn" id="expandAll">Expand all</button>
  <button class="btn" id="collapseAll">Collapse all</button>
  <button class="btn primary" id="exportBtn">Export state</button>
  <button class="btn" id="importBtn">Import</button>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <button class="btn danger" id="resetBtn">Reset</button>
</header>

<main>

<div class="stats" id="stats"></div>

<div class="bucket-bars">
  <h3>Progress by criticality</h3>
  <div id="bucketBars"></div>
</div>

<div class="filters">
  <input type="text" id="search" placeholder="Search title, file, notes…">
  <select id="filterStatus">
    <option value="all">All items</option>
    <option value="pending">Pending only</option>
    <option value="done">Done only</option>
  </select>
  <span class="chip" data-crit="critical">Critical</span>
  <span class="chip" data-crit="useful">Useful</span>
  <span class="chip" data-crit="niche">Niche</span>
  <span class="chip" data-crit="obsessiondb">ObsessionDB</span>
  <span class="chip" data-crit="backfill">Backfill</span>
  <span class="chip" data-crit="scaffolder">Scaffolder</span>
</div>

<div id="sections"></div>

<div class="empty" id="empty" style="display:none">No items match the current filters.</div>

</main>

<footer>
  State saved to localStorage as <code>chkit-py.parity.v1</code>. ·
  Source: <code>chkit_python/MISSING.md</code> and <code>packages/</code> in the TypeScript chkit repo.
</footer>

<script>
"use strict";

      { id: "init/--email",    title: "--email <email>", path: "packages/cli/src/commands/init.ts", loc: 5,  crit: "obsessiondb", notes: "OTP signup email (scriptable)." },

  {
    id: "cmd-check",

  {

    items: [
      { id: "plugin/list-all",      title: "chkit plugin (no args) — lists configured plugins + commands", path: "packages/cli/src/commands/plugin.ts", loc: 50, crit: "useful", notes: "" },

      { id: "query/json-envelope",        title: "--json output: ClickHouseJsonQueryResult envelope", path: "packages/cli/src/commands/query.ts", loc: 30, crit: "useful", notes: "data + meta + statistics + query_id." },

  {
    id: "cmd-skills",

  "backfill/doctor",
  "backfill/async-engine",
  "backfill/boundary-codec",
  "backfill/check-hook",
  "backfill/strat/metadata-single",
  "backfill/strat/temporal-bucket",
  "backfill/strat/equal-width",
  "backfill/strat/quantile",
  "backfill/strat/group-by-key",
  "backfill/strat/string-prefix",
  "backfill/strat/refinement",
  "backfill/svc/distribution",
  "backfill/svc/metadata",
  "backfill/svc/row-probe",
  // plugin-codegen extras — Pydantic supersedes Zod, ingest/migration emitters
  // can wait for demand (DRIFT.md "chkit_plugin_codegen")
  "codegen/zod",
  "codegen/ingest",
  "codegen/migrations",
  // rt/config — full profile-layer resolution + error enrichment (~250 LoC TS).
  // Foundation shipped (user_config + config_merge); the orchestrator itself is
  // pending — DRIFT.md "rt/config" tracks scope.
  "rt/config",
]);

function loadState() {
  const seed = {};
  for (const id of PORTED_BY_DEFAULT) seed[id] = true;
  for (const id of DECIDED_NA) seed[id] = true;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seed;
    return { ...seed, ...JSON.parse(raw) };
  } catch (_) { return seed; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
}
let state = loadState();
const activeCrits = new Set();

// ---------- helpers ----------
const allItems = SECTIONS.flatMap(s => s.items.map(i => ({...i, section: s.id})));
const totalCount = allItems.length;
const totalLoc = allItems.reduce((a, i) => a + (i.loc || 0), 0);

function doneCount() { return allItems.filter(i => state[i.id]).length; }
function doneLoc()   { return allItems.filter(i => state[i.id]).reduce((a, i) => a + (i.loc || 0), 0); }

function bucketSummary() {
  const out = {};
  for (const k of Object.keys(CRIT_LABELS)) out[k] = { total: 0, done: 0, locTotal: 0, locDone: 0 };
  for (const i of allItems) {
    const b = out[i.crit];
    if (!b) continue;
    b.total++;
    b.locTotal += i.loc || 0;
    if (state[i.id]) { b.done++; b.locDone += i.loc || 0; }
  }
  return out;
}

// ---------- render ----------
const $stats = document.getElementById("stats");
const $buckets = document.getElementById("bucketBars");
const $sections = document.getElementById("sections");
const $search = document.getElementById("search");
const $filterStatus = document.getElementById("filterStatus");
const $empty = document.getElementById("empty");

function renderStats() {
  const d = doneCount();
  const dl = doneLoc();
  const pct = totalCount ? Math.round((d / totalCount) * 100) : 0;
  const lpct = totalLoc ? Math.round((dl / totalLoc) * 100) : 0;
  $stats.innerHTML = `
    <div class="stat">
      <div class="stat-label">Items ported</div>
      <div class="stat-value">${d} <small>/ ${totalCount}</small></div>
      <div class="stat-bar"><div style="width:${pct}%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">LoC progress</div>
      <div class="stat-value">${dl.toLocaleString()} <small>/ ${totalLoc.toLocaleString()}</small></div>
      <div class="stat-bar"><div style="width:${lpct}%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Pending</div>
      <div class="stat-value">${totalCount - d}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Completion</div>
      <div class="stat-value">${pct}%</div>
    </div>
  `;
}

function renderBuckets() {
  const s = bucketSummary();
  $buckets.innerHTML = Object.entries(s).map(([k, b]) => {
    const pct = b.total ? Math.round((b.done / b.total) * 100) : 0;
    const c = CRIT_LABELS[k];
    return `
      <div class="bucket-row">
        <div class="name"><span class="badge b-${k}">${c.name}</span></div>
        <div class="bar"><div style="width:${pct}%; background:${c.color};"></div></div>
        <div class="num">${b.done} / ${b.total} <span style="color:var(--fg-muted)">·</span> ${b.locDone}/${b.locTotal} LoC</div>
      </div>
    `;
  }).join("");
}

function renderSections() {
  const open = new Set([...document.querySelectorAll(".section")].filter(s => !s.classList.contains("collapsed")).map(s => s.dataset.id));
  $sections.innerHTML = SECTIONS.map(sec => {
    const doneInSec = sec.items.filter(i => state[i.id]).length;
    return `
      <section class="section ${open.size === 0 || open.has(sec.id) ? "" : "collapsed"}" data-id="${sec.id}">
        <div class="section-head" data-toggle="${sec.id}">
          <span class="toggle">▾</span>
          <span class="title">${sec.title}</span>
          <span class="meta">${doneInSec} / ${sec.items.length} ported</span>
        </div>
        ${sec.notes ? `<div class="notes" style="font-size:12.5px;color:var(--fg-dim);margin:0 0 10px 0">${sec.notes}</div>` : ""}
        <div class="items">
          ${sec.items.map(it => renderItem(it)).join("")}
        </div>
      </section>
    `;
  }).join("");
  attachItemHandlers();
}

function renderItem(it) {
  const done = !!state[it.id];
  const checkedAttr = done ? "checked" : "";
  const doneClass = done ? "done" : "";
  return `
    <div class="item ${doneClass}" data-id="${it.id}" data-crit="${it.crit}">
      <input type="checkbox" ${checkedAttr} aria-label="Done">
      <div>
        <div class="row1">
          <span class="title">${it.title}</span>
          <span class="badge b-${it.crit}">${CRIT_LABELS[it.crit].name}</span>
          <span class="badge b-loc">~${it.loc} LoC</span>
        </div>
        ${it.path && it.path !== "—" ? `<div class="ts-path">${it.path}</div>` : ""}
        ${it.notes ? `<div class="notes">${it.notes}</div>` : ""}
      </div>
    </div>
  `;
}

function attachItemHandlers() {
  document.querySelectorAll(".item input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", (e) => {
      const itemEl = e.target.closest(".item");
      const id = itemEl.dataset.id;
      if (e.target.checked) state[id] = true; else delete state[id];
      saveState(state);
      itemEl.classList.toggle("done", e.target.checked);
      renderStats();
      renderBuckets();
      // Update the per-section counter only:
      const sec = itemEl.closest(".section");
      const secId = sec.dataset.id;
      const sd = SECTIONS.find(s => s.id === secId);
      const doneInSec = sd.items.filter(i => state[i.id]).length;
      sec.querySelector(".section-head .meta").textContent = `${doneInSec} / ${sd.items.length} ported`;
    });
  });
  document.querySelectorAll(".section-head").forEach(h => {
    h.addEventListener("click", (e) => {
      if (e.target.tagName === "INPUT") return;
      h.closest(".section").classList.toggle("collapsed");
    });
  });
}

// ---------- filters ----------
function applyFilters() {
  const q = $search.value.trim().toLowerCase();
  const status = $filterStatus.value;
  let visibleAny = false;
  document.querySelectorAll(".section").forEach(sec => {
    let secVisible = false;
    sec.querySelectorAll(".item").forEach(it => {
      const id = it.dataset.id;
      const crit = it.dataset.crit;
      const done = !!state[id];
      const matchQ = !q || it.textContent.toLowerCase().includes(q);
      const matchStatus = status === "all" || (status === "done" && done) || (status === "pending" && !done);
      const matchCrit = activeCrits.size === 0 || activeCrits.has(crit);
      const show = matchQ && matchStatus && matchCrit;
      it.classList.toggle("hidden", !show);
      if (show) { secVisible = true; visibleAny = true; }
    });
    sec.style.display = secVisible ? "" : "none";
  });
  $empty.style.display = visibleAny ? "none" : "";
}

$search.addEventListener("input", applyFilters);
$filterStatus.addEventListener("change", applyFilters);
document.querySelectorAll(".chip[data-crit]").forEach(ch => {
  ch.addEventListener("click", () => {
    const c = ch.dataset.crit;
    if (activeCrits.has(c)) { activeCrits.delete(c); ch.classList.remove("on"); }
    else { activeCrits.add(c); ch.classList.add("on"); }
    applyFilters();
  });
});

// ---------- top buttons ----------
document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("collapsed"));
});
document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll(".section").forEach(s => s.classList.add("collapsed"));
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Clear all ticks and reload?")) return;
  state = {};
  saveState(state);
  renderAll();
});
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = JSON.stringify({ savedAt: new Date().toISOString(), version: 1, state }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "chkit-py-parity-state.json";
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (obj && obj.state && typeof obj.state === "object") {
        state = obj.state;
        saveState(state);
        renderAll();
        alert("Imported.");
      } else { alert("Invalid file format."); }
    } catch (err) { alert("Failed to parse: " + err.message); }
  };
  reader.readAsText(file);
});

function renderAll() {
  renderStats();
  renderBuckets();
  renderSections();
  applyFilters();
}

renderAll();
</script>
</body>
</html>
